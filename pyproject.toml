[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "winery-direct-sales-viability"
version = "0.0.1"
description = "Analysis of a winery direct sales channel using historical sales data."
authors = [
  { name = "Miguel Devesa Ferrer" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
dependencies = [
    "ipython",
    "jupyterlab",
    "loguru",
    "matplotlib",
    "notebook",
    "numpy",
    "pandas",
    "pip",
    "pytest",
    "python-dotenv",
    "ruff",
    "scikit-learn",
    "tqdm",
    "typer",
]
requires-python = "==3.13.14"


[tool.ruff]
line-length = 99
src = ["winery_direct_sales_viability"]
include = ["pyproject.toml", "winery_direct_sales_viability/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["winery_direct_sales_viability"]
force-sort-within-sections = true

